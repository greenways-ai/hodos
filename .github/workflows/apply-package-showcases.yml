name: Apply package Showcase foundation

on:
  push:
    branches: [agent/package-showcase-foundation]
    paths: [.github/workflows/apply-package-showcases.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/package-showcase-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reassemble and install the package Showcase tree
        run: |
          cat .github/showcase-archive/chunk-* > /tmp/hodos-package-showcases.b64
          echo "Base64 archive: $(sha256sum /tmp/hodos-package-showcases.b64 | cut -d' ' -f1)"
          base64 --decode /tmp/hodos-package-showcases.b64 > /tmp/hodos-package-showcases.tar.gz
          echo "Compressed archive: $(sha256sum /tmp/hodos-package-showcases.tar.gz | cut -d' ' -f1)"
          printf '%s  %s\n' 'ebfc8e8dc344583951a72c1c4ebd76b39229b81aadbf25dcf5268c90ed482b6a' '/tmp/hodos-package-showcases.tar.gz' | sha256sum --check
          tar -tzf /tmp/hodos-package-showcases.tar.gz >/dev/null
          tar -xzf /tmp/hodos-package-showcases.tar.gz

      - name: Install repository dependencies
        run: npm ci

      - name: Validate package contracts
        run: |
          npm run audit:hal
          npm run check:packages
          npm run check:showcases
          npm run pack:check

      - name: Validate runtime, demo, and site
        run: |
          npm test
          npm run build:demo
          npm run site:install
          npm run site:build

      - name: Commit the package Showcase foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts/check-showcases.js packages/2d packages/2d-ui packages/workspace-ui
          git diff --cached --check
          git commit -m "Add package-owned READMEs and Showcases"
          git push origin HEAD:agent/package-showcase-foundation
