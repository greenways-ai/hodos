name: Materialize Hodos execution observability integration

on:
  push:
    branches:
      - agent/dev-execution-observability

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate Hara execution observability') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dev-execution-observability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Export the execution model and document the Hara boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('packages/dev/src/index.js')
          text = index.read_text()
          block = '''

          export {
            HARA_BYTECODE_EVENTS_SCHEMA,
            HARA_BYTECODE_METRICS_SCHEMA,
            HARA_BYTECODE_TRACE_SCHEMA,
            HODOS_DEV_EXECUTION_AREA_TYPE,
            HODOS_DEV_EXECUTION_COMPONENT_ID,
            HODOS_DEV_EXECUTION_EVENTS,
            createExecutionArea,
            createExecutionState,
            ingestExecutionEvidence,
            normalizeBytecodeEvents,
            normalizeBytecodeMetrics,
            normalizeBytecodeTrace,
            normalizeExecutionEvidence,
            resetExecutionState,
            selectExecutionState,
          } from "./execution.js";
          '''.replace('          ', '')
          if 'from "./execution.js"' not in text:
              text = text.rstrip() + block
          index.write_text(text)

          readme = Path('packages/dev/README.md')
          text = readme.read_text()
          text = text.replace(
              'The package exports constructors for seven serializable Workspace areas:',
              'The package exports constructors for eight serializable Workspace areas:',
          )
          text = text.replace(
              '  createEditorArea,\n  createExplorerArea,',
              '  createEditorArea,\n  createExecutionArea,\n  createExplorerArea,',
          )
          execution_section = '''

          ### Execution

          Execution models normalize three versioned Hara bytecode evidence levels:

          ```text
          hal.bytecode-metrics/v1  aggregate counters and high-water marks
          hal.bytecode-events/v1   compact sampled or control-flow events
          hal.bytecode-trace/v1    exact single-step state projections
          ```

          ```js
          const execution = createExecutionArea({
            state: createExecutionState({
              sessionId: "execution/lesson",
              capabilities: { pause: true, resume: true, requestTrace: true },
              limits: { events: 512, trace: 128 },
            }),
            evidence: [{
              schema: "hal.bytecode-metrics/v1",
              instructions: 7,
              opcodeCounts: { constant: 3, primitive: 1, return: 1 },
              maxStackDepth: 3,
              maxCallDepth: 1,
            }],
          });
          ```

          Hara remains authoritative for compilation, execution, instrumentation,
          suspension and full observations. Hodos validates, bounds, selects and
          presents the resulting serializable evidence. This package does not import
          the Hara runtime, WebAssembly, DOM, canvas or a 3D renderer. Products can
          begin with inexpensive metrics, add a compact event timeline, and request a
          full trace only when debugging or teaching requires exact machine state.
          '''.replace('          ', '')
          marker = '\n### Problems and Value Inspector\n'
          if '### Execution' not in text:
              if marker not in text:
                  raise SystemExit('README insertion marker not found')
              text = text.replace(marker, execution_section + marker, 1)
          text = text.replace(
              'repl/submit · repl/cancel · repl/history · repl/inspect-value\n',
              'repl/submit · repl/cancel · repl/history · repl/inspect-value\n'
              'execution/ingest · execution/select · execution/request-trace\n',
          )
          text = text.replace(
              '@greenways/hodos-dev\n  serializable developer-area models and semantic event contracts',
              '@greenways/hodos-dev\n  serializable developer-area models, Hara execution evidence and semantic event contracts',
          )
          readme.write_text(text)
          PY
      - name: Install and run focused Dev checks
        run: |
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          node --test packages/dev/test/*.test.js packages/dev-ui/test/*.test.js
          npm run audit:hal
          npm run check:packages
      - name: Commit the materialized integration
        run: |
          rm .github/workflows/agent-dev-execution-observability.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/dev packages/dev-ui .github/workflows/agent-dev-execution-observability.yml
          git commit -m "Integrate Hara execution observability"
          git push origin HEAD:agent/dev-execution-observability
