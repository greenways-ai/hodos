name: Validate Hodos 2D document and graph foundation

on:
  push:
    branches: [agent/2d-document-graph-foundation]
    paths: [.github/workflows/validate-2d-foundation.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/2d-document-graph-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh the workspace lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - run: npm ci

      - name: Validate Hodos 2D JavaScript
        run: |
          node --check packages/2d/src/index.js
          node --check packages/2d-ui/src/index.js
          node --check packages/2d/test/document.test.js
          node --check packages/2d/test/graph.test.js
          node --check packages/2d-ui/test/components.test.js

      - name: Run the complete Hodos gates
        run: |
          npm run audit:hal
          npm run check:packages
          npm run pack:check
          npm test
          npm run build:demo
          npm run site:install
          npm run site:check
          npm run site:build

      - name: Commit the validated foundation
        run: |
          rm .github/workflows/validate-2d-foundation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Hodos 2D document and graph foundation"
          git push origin HEAD:agent/2d-document-graph-foundation
