name: Deploy Hodos site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned Alumbra provider host
        uses: actions/checkout@v4
        with:
          repository: greenways-ai/alumbra
          ref: 419e02ebe06d90a43ae4510579e3acfaf6d4738e
          path: .alumbra-provider
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:demo
      - run: npm run site:install
      - run: npm run site:build
      - name: Install the pinned Alumbra browser dependency
        run: npm ci --prefix .alumbra-provider
      - name: Mount the existing demo and installed Alumbra provider under Hodos
        run: |
          mkdir -p site/dist/demo
          cp -R apps/demo/dist/. site/dist/demo/
          mkdir -p site/dist/alumbra/node_modules
          cp -R .alumbra-provider/apps site/dist/alumbra/apps
          cp -R .alumbra-provider/packages site/dist/alumbra/packages
          cp -R .alumbra-provider/node_modules/playcanvas site/dist/alumbra/node_modules/playcanvas
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
