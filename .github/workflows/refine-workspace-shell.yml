name: Refine responsive Workspace shell

on:
  push:
    branches: [agent/workspace-responsive-shell]
    paths: [.github/workflows/refine-workspace-shell.yml]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workspace-responsive-shell
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refine preference and listener semantics
        run: python3 .github/scripts/refine-workspace-shell.py

      - name: Validate Workspace shell JavaScript
        run: |
          node --check packages/workspace-ui/src/shell.js
          node --check packages/workspace-ui/src/index.js
          node --check packages/workspace-ui/test/shell-model.test.js
          node --check packages/workspace-ui/test/shell-host.test.js

      - name: Run the complete Hodos gates
        run: |
          npm run audit:hal
          npm run check:packages
          npm run pack:check
          npm test
          npm run build:demo
          npm run site:install
          npm run site:check
          npm run site:build

      - name: Commit the validated shell refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine responsive Workspace shell preferences"
          git push origin HEAD:agent/workspace-responsive-shell
