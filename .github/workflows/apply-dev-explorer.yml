name: Apply Hodos Dev Explorer migration

on:
  push:
    branches: [agent/dev-explorer-boundary]
    paths: [.github/workflows/apply-dev-explorer.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dev-explorer-boundary
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Align documentation migration anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply-dev-explorer.py')
          source = path.read_text(encoding='utf-8')
          replacements = [
              ('"      createEditorArea,\\n      createPreviewArea,"', '"  createEditorArea,\\n  createPreviewArea,"'),
              ('"      createEditorArea,\\n      createExplorerArea,\\n      createPreviewArea,"', '"  createEditorArea,\\n  createExplorerArea,\\n  createPreviewArea,"'),
              ('example_anchor = "    const preview = createPreviewArea({"', 'example_anchor = "const preview = createPreviewArea({"'),
              ('"    HAL owns document, session, diagnostic and retained-value identity, source"', '"HAL owns document, session, diagnostic and retained-value identity, source"'),
              ('"    HAL owns document, session, workspace-entry, diagnostic and retained-value identity, source"', '"HAL owns document, session, workspace-entry, diagnostic and retained-value identity, source"'),
              ('"    - Editor adapts an injected trusted editor host;\\n    - REPL adapts"', '"- Editor adapts an injected trusted editor host;\\n- REPL adapts"'),
              ('"    - Editor adapts an injected trusted editor host;\\n    - Explorer adapts an injected workspace-entry host;\\n    - REPL adapts"', '"- Editor adapts an injected trusted editor host;\\n- Explorer adapts an injected workspace-entry host;\\n- REPL adapts"'),
              ('"      createEditorHost: ({ container, dispatch }) => createEditorHost(container, dispatch),\\n      createReplHost:"', '"  createEditorHost: ({ container, dispatch }) => createEditorHost(container, dispatch),\\n  createReplHost:"'),
              ('"      createEditorHost: ({ container, dispatch }) => createEditorHost(container, dispatch),\\n      createExplorerHost: ({ container, dispatch }) => createExplorerHost(container, dispatch),\\n      createReplHost:"', '"  createEditorHost: ({ container, dispatch }) => createEditorHost(container, dispatch),\\n  createExplorerHost: ({ container, dispatch }) => createExplorerHost(container, dispatch),\\n  createReplHost:"'),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'Explorer documentation anchor count for {old!r}: {source.count(old)}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          compile(source, str(path), 'exec')
          PY

      - name: Apply the Explorer component boundary
        run: python3 .github/scripts/apply-dev-explorer.py

      - name: Validate changed JavaScript
        run: |
          node --check packages/dev/src/index.js
          node --check packages/dev-ui/src/index.js
          node --check packages/dev/test/explorer.test.js
          node --check packages/dev-ui/test/explorer-component.test.js

      - name: Run the complete Hodos gates
        run: |
          npm run audit:hal
          npm run check:packages
          npm run pack:check
          npm test
          npm run build:demo
          npm run site:install
          npm run site:check
          npm run site:build

      - name: Commit the validated boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Hodos Dev explorer component boundary"
          git push origin HEAD:agent/dev-explorer-boundary
