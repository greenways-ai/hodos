name: Repair Hodos Dev Catalog gate

on:
  push:
    branches: [agent/dev-catalog-boundary]
    paths: [.github/workflows/repair-dev-catalog-gate.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dev-catalog-boundary
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply the Catalog boundary
        run: python3 .github/scripts/apply-dev-catalog.py

      - name: Align exact combined-registration expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          pattern = re.compile(
              r'(assert\.deepEqual\(registry\.list\(\), \[\n)(.*?)(\n\s*\]\);)',
              re.S,
          )
          for path in Path('packages/dev-ui/test').glob('*.test.js'):
              source = path.read_text(encoding='utf-8')
              if 'registerHodosDevUi' not in source or 'registry.list()' not in source:
                  continue

              def include_catalog(match):
                  body = match.group(2)
                  if '"hodos.dev/catalog"' in body:
                      return match.group(0)
                  lines = body.splitlines()
                  indent = '    '
                  for line in lines:
                      if line.strip().startswith('"hodos.dev/'):
                          indent = line[:len(line) - len(line.lstrip())]
                          break
                  lines.append(f'{indent}"hodos.dev/catalog",')
                  entries = sorted(
                      [line for line in lines if line.strip().startswith('"hodos.dev/')],
                      key=lambda line: line.strip(),
                  )
                  other = [line for line in lines if not line.strip().startswith('"hodos.dev/')]
                  return match.group(1) + '\n'.join(entries + other) + match.group(3)

              updated, count = pattern.subn(include_catalog, source)
              if count and updated != source:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No combined Hodos Dev registry expectation required Catalog alignment')
          print('\n'.join(changed))
          PY

      - name: Validate changed JavaScript
        run: |
          node --check packages/dev/src/index.js
          node --check packages/dev-ui/src/index.js
          node --check packages/dev/test/catalog.test.js
          node --check packages/dev-ui/test/catalog-component.test.js

      - name: Run the complete Hodos gates
        run: |
          npm run audit:hal
          npm run check:packages
          npm run pack:check
          npm test
          npm run build:demo
          npm run site:install
          npm run site:check
          npm run site:build

      - name: Commit only the validated product tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages
          git commit -m "Add Hodos Dev catalog component boundary"
          git push origin HEAD:agent/dev-catalog-boundary
