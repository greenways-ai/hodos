name: Hodos CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:hal
      - run: npm run check:packages
      - run: npm run pack:check
      - run: npm test
      - run: npm run build:demo
      - run: npm run site:install
      - run: npm run site:build
