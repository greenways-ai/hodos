name: Hodos CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Temporary migration aid: generate the workspace lock artifact for this
      # branch, then commit it and remove this step before the PR is merged.
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: hodos-package-lock
          path: package-lock.json
      - run: npm ci
      - run: npm run audit:hal
      - run: npm run check:packages
      - run: npm run pack:check
      - run: npm test
      - run: npm run build:demo
      - run: npm run site:install
      - run: npm run site:build
