name: Repair animation demo app binding 107

on:
  push:
    branches: [agent/mixamo-animation-demo-106]
    paths: [.github/workflows/fix-animation-demo-app-binding-107.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/mixamo-animation-demo-106
          fetch-depth: 0

      - name: Bind every procedural entity to the PlayCanvas app
        shell: python
        run: |
          from pathlib import Path

          source = Path("packages/renderer-playcanvas/src/mixamo-animation-workbench.js")
          text = source.read_text()

          replacements = [
              ("function addPrimitive(parent, {", "function addPrimitive(app, parent, {", 1),
              ("  const entity = new Entity(name);", "  const entity = new Entity(name, app);", 1),
              ("function decorateProceduralMannequin(root, joints) {", "function decorateProceduralMannequin(app, root, joints) {", 1),
              ("addPrimitive(joints.", "addPrimitive(app, joints.", 17),
              (
                  "} = {}) {\n  const root = new Entity(name);\n  const armature = new Entity(\"Armature\");",
                  "} = {}) {\n  if (!app) throw new TypeError(\"Procedural Mixamo mannequin requires a PlayCanvas app\");\n  const root = new Entity(name, app);\n  const armature = new Entity(\"Armature\", app);",
                  1,
              ),
              (
                  "    const entity = new Entity(`mixamorig:${joint}`);",
                  "    const entity = new Entity(`mixamorig:${joint}`, app);",
                  1,
              ),
              (
                  "  if (visuals) decorateProceduralMannequin(root, joints);",
                  "  if (visuals) decorateProceduralMannequin(app, root, joints);",
                  1,
              ),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{source}: expected {expected} occurrences of {old!r}, found {count}")
              text = text.replace(old, new)
          source.write_text(text)

          tests = Path("packages/renderer-playcanvas/test/mixamo-animation-workbench.test.js")
          text = tests.read_text()
          anchor = "function renameMixamoJoints(root, transform) {"
          helper = "function testApp() {\n  return { _entityIndex: Object.create(null) };\n}\n\n"
          if text.count(anchor) != 1:
              raise SystemExit(f"{tests}: expected one helper insertion anchor")
          text = text.replace(anchor, helper + anchor)
          old = "createProceduralMixamoMannequin(null, {"
          if text.count(old) != 3:
              raise SystemExit(f"{tests}: expected three null-app mannequin calls")
          text = text.replace(old, "createProceduralMixamoMannequin(testApp(), {")
          tests.write_text(text)

      - name: Validate the focused workbench suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --check packages/renderer-playcanvas/src/mixamo-animation-workbench.js
          node --test packages/renderer-playcanvas/test/mixamo-animation-workbench.test.js

      - name: Commit the repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-animation-demo-app-binding-107.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bind procedural animation entities to PlayCanvas"
          git push origin HEAD:agent/mixamo-animation-demo-106
