name: Diagnose Hodos Dev Catalog gate

on:
  push:
    branches: [agent/dev-catalog-boundary]
    paths: [.github/workflows/diagnose-dev-catalog.yml]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dev-catalog-boundary
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Capture the exact Catalog failure
        run: |
          set +e
          {
            echo '## npm ci'
            npm ci
            echo "exit=$?"
            echo
            echo '## migration'
            python3 .github/scripts/apply-dev-catalog.py
            migration_status=$?
            echo "exit=${migration_status}"
            if [ "${migration_status}" -eq 0 ]; then
              echo
              echo '## syntax'
              node --check packages/dev/src/index.js
              echo "dev-model-exit=$?"
              node --check packages/dev-ui/src/index.js
              echo "dev-ui-exit=$?"
              node --check packages/dev/test/catalog.test.js
              echo "catalog-test-syntax-exit=$?"
              node --check packages/dev-ui/test/catalog-component.test.js
              echo "catalog-ui-test-syntax-exit=$?"
              echo
              echo '## audit:hal'
              npm run audit:hal
              echo "exit=$?"
              echo
              echo '## check:packages'
              npm run check:packages
              echo "exit=$?"
              echo
              echo '## pack:check'
              npm run pack:check
              echo "exit=$?"
              echo
              echo '## npm test'
              npm test
              echo "exit=$?"
              echo
              echo '## build:demo'
              npm run build:demo
              echo "exit=$?"
              echo
              echo '## site:install'
              npm run site:install
              echo "exit=$?"
              echo
              echo '## site:check'
              npm run site:check
              echo "exit=$?"
              echo
              echo '## site:build'
              npm run site:build
              echo "exit=$?"
            fi
          } > catalog-diagnostic.txt 2>&1
          exit 0

      - name: Commit only the diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-diagnostic.txt
          git commit -m "Capture Hodos Catalog gate diagnostics"
          git push origin HEAD:agent/dev-catalog-boundary
