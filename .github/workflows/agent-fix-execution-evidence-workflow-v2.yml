name: Fix Execution evidence implementation workflow v2

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/execution-evidence-identity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/execution-evidence-identity
          fetch-depth: 0
      - name: Make the focused patcher whitespace tolerant
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/agent-apply-execution-evidence-identity.yml')
          text = path.read_text()
          old = "          from pathlib import Path\n\n          def replace_once(path, old, new):\n              text = path.read_text()\n              if new in text:\n                  return\n              if old not in text:\n                  raise SystemExit(f\"expected block missing in {path}\")\n              path.write_text(text.replace(old, new, 1))\n"
          new = "          from pathlib import Path\n          import re\n\n          def replace_once(path, old, new):\n              text = path.read_text()\n              if new in text:\n                  return\n              if old in text:\n                  path.write_text(text.replace(old, new, 1))\n                  return\n              lines = old.splitlines()\n              pattern = \"\\\\n\".join(r\"[ \\\\t]*\" + re.escape(line.strip()) + r\"[ \\\\t]*\" for line in lines)\n              match = re.search(pattern, text)\n              if match is None:\n                  raise SystemExit(f\"expected block missing in {path}: {lines[0] if lines else '<empty>'}\")\n              path.write_text(text[:match.start()] + new + text[match.end():])\n"
          if new not in text:
              if old not in text:
                  raise SystemExit('temporary workflow helper block not found')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit workflow correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/agent-apply-execution-evidence-identity.yml
          git commit -m "Make Execution evidence patch workflow whitespace tolerant"
          git push origin HEAD:agent/execution-evidence-identity
