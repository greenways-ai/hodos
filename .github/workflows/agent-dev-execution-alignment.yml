name: Align Hodos execution evidence with Hara instrumentation

on:
  push:
    branches:
      - agent/dev-execution-observability

permissions:
  contents: write

jobs:
  align:
    if: ${{ !contains(github.event.head_commit.message, 'Align Hodos with named bytecode metrics') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dev-execution-observability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Accept Hara named opcode count arrays
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/dev/src/execution.js')
          text = path.read_text()
          old = '''const opcodeCountsValue = (value = {}) => {
            const counts = objectValue(value, "Hara bytecode metrics opcodeCounts");
            const output = {};
            for (const [opcode, count] of Object.entries(counts)) {
              output[nonEmptyString(opcode, "Hara bytecode metrics opcode")] = nonNegativeInteger(
                count,
                `Hara bytecode metrics opcode ${opcode}`,
              );
            }
            return Object.freeze(output);
          };'''.replace('          ', '')
          new = '''const opcodeCountsValue = (value = {}) => {
            const output = {};
            if (Array.isArray(value)) {
              value.forEach((entry, index) => {
                const count = objectValue(entry, `Hara bytecode opcode count ${index}`);
                const opcode = nonEmptyString(
                  count.opcode,
                  `Hara bytecode opcode count ${index} opcode`,
                );
                output[opcode] = nonNegativeInteger(
                  count.count,
                  `Hara bytecode opcode count ${index} count`,
                );
              });
              return Object.freeze(output);
            }
            const counts = objectValue(value, "Hara bytecode metrics opcodeCounts");
            for (const [opcode, count] of Object.entries(counts)) {
              output[nonEmptyString(opcode, "Hara bytecode metrics opcode")] = nonNegativeInteger(
                count,
                `Hara bytecode metrics opcode ${opcode}`,
              );
            }
            return Object.freeze(output);
          };'''.replace('          ', '')
          if old not in text:
              raise SystemExit('opcodeCountsValue marker not found')
          path.write_text(text.replace(old, new, 1))

          tests = Path('packages/dev/test/execution.test.js')
          text = tests.read_text()
          addition = '''

          test("execution metrics accept Hara named opcode count projections", () => {
            const evidence = normalizeExecutionEvidence({
              schema: HARA_BYTECODE_METRICS_SCHEMA,
              instructions: 4,
              opcode_counts: [
                { opcode: "constant", count: 2 },
                { opcode: "return", count: 1 },
              ],
            });
            assert.equal(evidence.level, "metrics");
            assert.deepEqual(evidence.value.opcodeCounts, { constant: 2, return: 1 });
          });
          '''.replace('          ', '')
          if 'accept Hara named opcode count projections' not in text:
              text = text.rstrip() + addition
          tests.write_text(text)
          PY
      - name: Validate aligned execution evidence
        run: |
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          node --test packages/dev/test/*.test.js packages/dev-ui/test/*.test.js
          npm run audit:hal
          npm run check:packages
      - name: Commit alignment
        run: |
          rm .github/workflows/agent-dev-execution-alignment.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/dev .github/workflows/agent-dev-execution-alignment.yml
          git commit -m "Align Hodos with named bytecode metrics"
          git push origin HEAD:agent/dev-execution-observability
