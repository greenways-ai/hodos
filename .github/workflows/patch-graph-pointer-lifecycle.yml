name: Patch Graph pointer selection lifecycle

on:
  push:
    branches: [agent/graph-pointer-selection-lifecycle]
    paths: [.github/workflows/patch-graph-pointer-lifecycle.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graph-pointer-selection-lifecycle
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Separate canonical selection from pointer capture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('packages/2d-ui/src/graph-dom-host.js')
          source = source_path.read_text(encoding='utf-8')
          start_marker = '      const selectNode = (event) => {'
          end_marker = '      addListener(header, "pointermove", (event) => {'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'Unable to locate Graph pointer lifecycle block: start={start}, end={end}')
          replacement = '''      const selectNode = (event) => {
                if (!view.capabilities.select) return false;
                const nodeIds = toggled(view.selection.nodeIds, node.id, Boolean(event?.shiftKey));
                const connectionIds = event?.shiftKey ? view.selection.connectionIds : [];
                const unchanged = nodeIds.length === view.selection.nodeIds.length
                  && nodeIds.every((id, index) => id === view.selection.nodeIds[index])
                  && connectionIds.length === view.selection.connectionIds.length
                  && connectionIds.every((id, index) => id === view.selection.connectionIds[index]);
                if (unchanged) return false;
                send("graph/select", {
                  graphId: view.id,
                  nodeIds,
                  connectionIds,
                });
                return true;
              };

              let drag = null;
              addListener(header, "pointerdown", (event) => {
                if (event.button != null && event.button !== 0) return;
                event.stopPropagation?.();
                // Selection may synchronously replace this DOM host. Complete that
                // semantic boundary before beginning a later stable drag gesture.
                if (selectNode(event)) return;
                if (view.readOnly || node.readOnly || !view.capabilities.moveNode) return;
                event.preventDefault?.();
                header.setPointerCapture?.(event.pointerId);
                header.classList?.add("dragging");
                drag = {
                  pointerId: event.pointerId,
                  clientX: finite(event.clientX),
                  clientY: finite(event.clientY),
                  x: nodeCoordinates.get(node.id).x,
                  y: nodeCoordinates.get(node.id).y,
                  moved: false,
                };
              }, controller);

          '''
          replacement = '\n'.join(line[6:] if line.startswith('      ') else line for line in replacement.splitlines())
          source_path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')

          test_path = Path('packages/2d-ui/test/graph-dom-host.test.js')
          test_source = test_path.read_text(encoding='utf-8')
          test_source = test_source.replace(
              '    this.disabled = false;\n    this.type = "";\n',
              '    this.disabled = false;\n    this.type = "";\n    this.capturedPointers = [];\n    this.releasedPointers = [];\n',
              1,
          )
          test_source = test_source.replace(
              '  setPointerCapture() {}\n  releasePointerCapture() {}\n',
              '  setPointerCapture(pointerId) { this.capturedPointers.push(pointerId); }\n  releasePointerCapture(pointerId) { this.releasedPointers.push(pointerId); }\n',
              1,
          )
          test_source = test_source.replace(
              'const model = () => createGraphArea({',
              'const model = (selection = { nodeIds: [], connectionIds: [] }) => createGraphArea({',
              1,
          )
          test_source = test_source.replace(
              '  selection: { nodeIds: [], connectionIds: [] },',
              '  selection,',
              1,
          )
          test_start_marker = 'test("Graph DOM host emits selection, move and connection semantics", () => {'
          test_end_marker = '\ntest("Graph DOM source avoids HTML interpolation and executable evaluation"'
          test_start = test_source.find(test_start_marker)
          test_end = test_source.find(test_end_marker, test_start)
          if test_start < 0 or test_end < 0:
              raise SystemExit(f'Unable to locate Graph host test block: start={test_start}, end={test_end}')
          test_replacement = '''test("Graph DOM host separates selection from drag and emits connection semantics", () => {
            const document = new FakeDocument();
            const container = new FakeElement("div", document);
            const events = [];
            const host = createGraphDomHost({
              container,
              dispatch: (event) => events.push(event),
            });
            host.update(model());
            let nodes = walk(container);
            assert.equal(container.dataset.hodosComponent, "hodos.2d/graph");
            assert.equal(nodes.some((node) => node.tagName === "SVG"), true);

            let source = nodes.find((node) => node.dataset?.nodeId === "node/source" && node.tagName === "ARTICLE");
            let handle = nodes.find((node) => node.dataset?.graphDragHandle === "node/source");
            assert.ok(source);
            assert.ok(handle);
            handle.emit("pointerdown", { button: 0, pointerId: 7, clientX: 10, clientY: 20 });
            handle.emit("pointermove", { pointerId: 7, clientX: 50, clientY: 60 });
            handle.emit("pointerup", { pointerId: 7, clientX: 50, clientY: 60 });
            assert.deepEqual(events.map((event) => event["event/type"]), ["graph/select"]);
            assert.deepEqual(handle.capturedPointers, []);

            host.update(model({ nodeIds: ["node/source"], connectionIds: [] }));
            nodes = walk(container);
            source = nodes.find((node) => node.dataset?.nodeId === "node/source" && node.tagName === "ARTICLE");
            handle = nodes.find((node) => node.dataset?.graphDragHandle === "node/source");
            assert.ok(source);
            assert.ok(handle);
            handle.emit("pointerdown", { button: 0, pointerId: 7, clientX: 10, clientY: 20 });
            handle.emit("pointermove", { pointerId: 7, clientX: 50, clientY: 60 });
            handle.emit("pointerup", { pointerId: 7, clientX: 50, clientY: 60 });
            assert.deepEqual(handle.capturedPointers, [7]);
            assert.deepEqual(handle.releasedPointers, [7]);

            const output = nodes.find((node) => node.dataset?.nodeId === "node/source" && node.dataset?.portId === "out:0");
            const input = nodes.find((node) => node.dataset?.nodeId === "node/target" && node.dataset?.portId === "in:0");
            output.emit("click");
            input.emit("click");

            const connection = nodes.find((node) => node.dataset?.connectionId === "connection/main");
            connection.emit("click");

            assert.deepEqual(events.map((event) => event["event/type"]), [
              "graph/select",
              "graph/move-node",
              "graph/connect",
              "graph/select",
            ]);
            assert.deepEqual(events[1], {
              "event/type": "graph/move-node",
              graphId: "graph/main",
              nodeId: "node/source",
              x: 60,
              y: 80,
            });
            assert.deepEqual(events[2], {
              "event/type": "graph/connect",
              graphId: "graph/main",
              from: { nodeId: "node/source", portId: "out:0" },
              to: { nodeId: "node/target", portId: "in:0" },
            });
            assert.equal(source.style.left, "140px");
            assert.equal(connection.attributes.get("d").startsWith("M "), true);

            host.dispose();
            assert.equal(container.children.length, 0);
            assert.equal(container.dataset.hodosComponent, undefined);
          });
          '''
          test_replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in test_replacement.splitlines())
          test_path.write_text(test_source[:test_start] + test_replacement + test_source[test_end:], encoding='utf-8')
          PY

      - name: Validate the complete Hodos release gate
        run: |
          npm ci
          npm run audit:hal
          npm run check:packages
          npm run pack:check
          npm test
          npm run build:demo
          npm run site:install
          npm run site:build

      - name: Commit the lifecycle repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/2d-ui/src/graph-dom-host.js packages/2d-ui/test/graph-dom-host.test.js
          git diff --cached --check
          git commit -m "Separate Graph selection from pointer capture"
          git push origin HEAD:agent/graph-pointer-selection-lifecycle
