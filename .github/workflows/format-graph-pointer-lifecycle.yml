name: Format Graph pointer lifecycle repair

on:
  push:
    branches: [agent/graph-pointer-selection-lifecycle]
    paths: [.github/workflows/format-graph-pointer-lifecycle.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graph-pointer-selection-lifecycle
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore repository indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/2d-ui/src/graph-dom-host.js')
          source = path.read_text(encoding='utf-8')
          start_marker = 'const selectNode = (event) => {'
          end_marker = '      addListener(header, "pointermove", (event) => {'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'Unable to locate flattened Graph lifecycle block: start={start}, end={end}')
          replacement = "\n".join([
              '      const selectNode = (event) => {',
              '        if (!view.capabilities.select) return false;',
              '        const nodeIds = toggled(view.selection.nodeIds, node.id, Boolean(event?.shiftKey));',
              '        const connectionIds = event?.shiftKey ? view.selection.connectionIds : [];',
              '        const unchanged = nodeIds.length === view.selection.nodeIds.length',
              '          && nodeIds.every((id, index) => id === view.selection.nodeIds[index])',
              '          && connectionIds.length === view.selection.connectionIds.length',
              '          && connectionIds.every((id, index) => id === view.selection.connectionIds[index]);',
              '        if (unchanged) return false;',
              '        send("graph/select", {',
              '          graphId: view.id,',
              '          nodeIds,',
              '          connectionIds,',
              '        });',
              '        return true;',
              '      };',
              '',
              '      let drag = null;',
              '      addListener(header, "pointerdown", (event) => {',
              '        if (event.button != null && event.button !== 0) return;',
              '        event.stopPropagation?.();',
              '        // Selection may synchronously replace this DOM host. Complete that',
              '        // semantic boundary before beginning a later stable drag gesture.',
              '        if (selectNode(event)) return;',
              '        if (view.readOnly || node.readOnly || !view.capabilities.moveNode) return;',
              '        event.preventDefault?.();',
              '        header.setPointerCapture?.(event.pointerId);',
              '        header.classList?.add("dragging");',
              '        drag = {',
              '          pointerId: event.pointerId,',
              '          clientX: finite(event.clientX),',
              '          clientY: finite(event.clientY),',
              '          x: nodeCoordinates.get(node.id).x,',
              '          y: nodeCoordinates.get(node.id).y,',
              '          moved: false,',
              '        };',
              '      }, controller);',
              '',
          ])
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')

          test_path = Path('packages/2d-ui/test/graph-dom-host.test.js')
          test_source = test_path.read_text(encoding='utf-8')
          test_source = test_source.replace(
              '  assert.equal(container.dataset.hodosComponent, undefined);\n});\ntest("Graph DOM source',
              '  assert.equal(container.dataset.hodosComponent, undefined);\n});\n\ntest("Graph DOM source',
              1,
          )
          test_path.write_text(test_source, encoding='utf-8')
          PY

      - name: Validate the formatted repair
        run: |
          npm ci
          node --check packages/2d-ui/src/graph-dom-host.js
          node --test packages/2d-ui/test/graph-dom-host.test.js
          npm test

      - name: Commit the formatting repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/2d-ui/src/graph-dom-host.js packages/2d-ui/test/graph-dom-host.test.js
          git diff --cached --check
          git commit -m "Format the Graph pointer lifecycle repair"
          git push origin HEAD:agent/graph-pointer-selection-lifecycle
