name: Apply Hodos Dev Catalog migration

on:
  push:
    branches: [agent/dev-catalog-boundary]
    paths: [.github/workflows/apply-dev-catalog.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dev-catalog-boundary
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate the migration program
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/scripts/apply-dev-catalog.py').read_text(encoding='utf-8')
          compile(source, '.github/scripts/apply-dev-catalog.py', 'exec')
          PY

      - name: Apply the Catalog component boundary
        run: python3 .github/scripts/apply-dev-catalog.py

      - name: Validate changed JavaScript
        run: |
          node --check packages/dev/src/index.js
          node --check packages/dev-ui/src/index.js
          node --check packages/dev/test/catalog.test.js
          node --check packages/dev-ui/test/catalog-component.test.js

      - name: Run the complete Hodos gates
        run: |
          npm run audit:hal
          npm run check:packages
          npm run pack:check
          npm test
          npm run build:demo
          npm run site:install
          npm run site:check
          npm run site:build

      - name: Commit the validated boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Hodos Dev catalog component boundary"
          git push origin HEAD:agent/dev-catalog-boundary
