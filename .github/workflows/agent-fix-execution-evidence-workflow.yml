name: Fix Execution evidence implementation workflow

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/execution-evidence-identity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/execution-evidence-identity
          fetch-depth: 0
      - name: Make the focused patcher whitespace tolerant
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/agent-apply-execution-evidence-identity.yml')
          text = path.read_text()
          old = '''          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected block missing in {path}")
              path.write_text(text.replace(old, new, 1))
'''
          new = '''          from pathlib import Path
          import re

          def replace_once(path, old, new):
              text = path.read_text()
              if new in text:
                  return
              if old in text:
                  path.write_text(text.replace(old, new, 1))
                  return
              lines = old.splitlines()
              pattern = "\\n".join(
                  r"[ \\t]*" + re.escape(line.strip()) + r"[ \\t]*"
                  for line in lines
              )
              match = re.search(pattern, text)
              if match is None:
                  raise SystemExit(f"expected block missing in {path}: {lines[0] if lines else '<empty>'}")
              path.write_text(text[:match.start()] + new + text[match.end():])
'''
          if new not in text:
              if old not in text:
                  raise SystemExit('temporary workflow helper block not found')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit workflow correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/agent-apply-execution-evidence-identity.yml
          git commit -m "Make Execution evidence patch workflow whitespace tolerant"
          git push origin HEAD:agent/execution-evidence-identity
