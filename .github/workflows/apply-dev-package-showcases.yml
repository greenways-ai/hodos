name: Apply Dev package Showcases

on:
  push:
    branches: [agent/dev-package-showcases]
    paths: [.github/workflows/apply-dev-package-showcases.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dev-package-showcases
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reassemble and install the Dev package Showcase tree
        run: |
          cat .github/dev-showcase-archive/chunk-* > /tmp/hodos-dev-showcases.b64
          printf '%s  %s\n' '3a25eff4c470331a0235963b38f690d90a4b3b2b515eea4d31fe913f352b8d51' '/tmp/hodos-dev-showcases.b64' | sha256sum --check
          base64 --decode /tmp/hodos-dev-showcases.b64 > /tmp/hodos-dev-showcases.tar.gz
          printf '%s  %s\n' '0e0cc3716a9e2e56bcf0ca1c122231991080b29ed616106891b20b507de3982a' '/tmp/hodos-dev-showcases.tar.gz' | sha256sum --check
          tar -tzf /tmp/hodos-dev-showcases.tar.gz >/dev/null
          tar -xzf /tmp/hodos-dev-showcases.tar.gz

      - name: Install repository dependencies
        run: npm ci

      - name: Validate package contracts
        run: |
          npm run audit:hal
          npm run check:packages
          npm run check:showcases
          npm run pack:check

      - name: Validate runtime, demo, and site
        run: |
          npm test
          npm run build:demo
          npm run site:install
          npm run site:build

      - name: Commit the Dev package Showcase wave
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/dev packages/dev-ui
          git diff --cached --check
          git commit -m "Add Dev package READMEs and Showcases"
          git push origin HEAD:agent/dev-package-showcases
