name: Apply Execution evidence identity v2

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/execution-evidence-identity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/execution-evidence-identity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused package patch
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('scripts/agent-apply-execution-evidence-identity.py').read_text()
          start = source.index('execution_hal = Path(')
          end = source.index('# Make the existing concrete-host test')
          Path('/tmp/apply-execution-evidence-identity.py').write_text(source[:start] + source[end:])
          PY
          python -m py_compile /tmp/apply-execution-evidence-identity.py
          python /tmp/apply-execution-evidence-identity.py
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('packages/dev/src/gw/hodos/dev/execution.hal')
          text = path.read_text()
          if ':droppedTrace 0' not in text:
              pattern = re.compile(
                  r':session session\n'
                  r'\s+:evidence evidence\n'
                  r'\s+:retention \(get options :retention\n'
                  r'\s+\{:limits \{:events 512 :trace 128 :diagnostics 64\}\n'
                  r'\s+:eventsOmitted 0\n'
                  r'\s+:traceOmitted 0\n'
                  r'\s+:droppedEvents 0\}\)'
              )
              replacement = ''':session (merge {:traceId nil
                         :sourceId nil
                         :sequence {:metrics nil :events nil :trace nil}}
                        session)
       :evidence evidence
       :retention (get options :retention
                       {:limits {:events 512 :trace 128 :diagnostics 64}
                        :eventsOmitted 0
                        :traceOmitted 0
                        :droppedEvents 0
                        :droppedTrace 0})'''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('expected Hara Execution model block missing')
              path.write_text(text)
          PY
      - run: git diff --check
      - run: npm ci
      - run: npm run audit:hal
      - run: npm run check:packages
      - run: npm run check:showcases
      - run: npm run pack:check
      - run: npm test
      - run: npm run build:demo
      - run: npm run site:install
      - run: npm run site:build
      - name: Commit package implementation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/dev packages/dev-ui
          git commit -m "Preserve live Execution evidence identity"
          git push origin HEAD:agent/execution-evidence-identity
