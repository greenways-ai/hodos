name: Capture Hodos demo imagery
on:
  push:
    branches: [agent/demo-visual-language]
    paths:
      - .github/workflows/capture-demo-imagery.yml
      - scripts/capture-demo-screenshots.mjs
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/demo-visual-language
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build:demo
      - run: node scripts/capture-demo-screenshots.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit captures
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/demo/public/demo-*.png
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit"
            exit 0
          fi
          git commit -m "Capture the Hodos demo surfaces"
          git push origin HEAD:agent/demo-visual-language
